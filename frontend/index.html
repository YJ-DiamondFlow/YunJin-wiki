<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云锦巡梦 · 官方 Wiki</title>
  <meta name="description" content="云锦巡梦音游战队官方 Wiki —— 战队资料、成员、考核规则与通知。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%230b0c0e'/%3E%3Crect x='14.5' y='14.5' width='71' height='71' rx='6' fill='none' stroke='%23ffffff' stroke-opacity='.45'/%3E%3Ctext x='50' y='67' font-size='46' text-anchor='middle' fill='%23ffffff' font-family='serif'%3E%E4%BA%91%3C/text%3E%3C/svg%3E" />
  <script>
    // 首屏前应用主题，避免闪烁
    (function () {
      try {
        var t = localStorage.getItem('yj_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    #yj-boot {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9aa0a9;
      text-align: center;
      padding: 24px;
      line-height: 1.9;
    }
    #yj-boot::before {
      content: '';
      width: 34px;
      height: 34px;
      border-radius: 4px;
      border: 1px solid #dcdde1;
      background-image: radial-gradient(circle at 50% 50%, #0b0c0e 1.5px, transparent 1.6px);
      background-size: 8px 8px;
    }
    #yj-boot h3 {
      color: #0b0c0e;
      font-size: 14px;
      letter-spacing: 0.12em;
      font-weight: 600;
    }
    #yj-boot a {
      color: #0b0c0e;
      border-bottom: 1px solid #dcdde1;
      text-decoration: none;
    }
    html[data-theme='dark'] #yj-boot { color: #61666e; }
    html[data-theme='dark'] #yj-boot::before { border-color: #2c2f35; }
    html[data-theme='dark'] #yj-boot h3 { color: #ffffff; }
    html[data-theme='dark'] #yj-boot a { color: #ffffff; border-bottom-color: #2c2f35; }
  </style>
</head>
<body>
  <div id="app">
    <div id="yj-boot">正在加载…</div>
  </div>

  <script>
    // 兜底：若 6 秒后应用仍未挂载完成（前端资源已更新 / 后端未启动），
    // 给出明确提示与刷新入口，避免出现「页面出来了但点不动、打不了字」的假死状态。
    setTimeout(function () {
      if (window.__yjBooted) return;
      var el = document.getElementById('yj-boot');
      if (!el) return;
      el.innerHTML =
        '<h3>页面加载失败</h3>' +
        '<p>可能是前端资源已更新，或后端服务没有启动。</p>' +
        '<p><a href="javascript:window.location.reload(true)">点此刷新页面</a></p>';
    }, 6000);
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
